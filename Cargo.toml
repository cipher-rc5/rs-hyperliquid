[package]
name = "rs-hyperliquid"
version = "0.1.0"
authors = ["cipher <https://github.com/cipher-rc5>"]
categories = ["command-line-utilities", "api-bindings", "asynchronous"]
edition = "2024"
exclude = ["examples/debug_connection"]
homepage = "https://github.com/cipher-rc5/rs-hyperliquid"
keywords = ["hyperliquid", "websocket", "trading", "cryptocurrency", "real-time"]
license = "MIT"
readme = "readme.md"
repository = "https://github.com/cipher-rc5/rs-hyperliquid"
rust-version = "1.99.1"
description = "high-performance WebSocket client for Hyperliquid trading data with real-time market data streaming"

[[bin]]
name = "rs-hyperliquid"
path = "src/main.rs"

[[example]]
name = "debug_connection"
path = "examples/debug_connection.rs"

[dependencies]
# error handling
anyhow = "1.0.104"
thiserror = "2.0.21"

# serialization and message types
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# cli and runtime
clap = { version = "4.6.7", features = ["derive", "color", "suggestions"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

# networking and transport
base64 = "0.23.1"
fastrand = "2.5.0"
fastwebsockets = "0.10.0"
getrandom = "0.4.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }

# observability
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# utility crates
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
webpki-roots = "1.0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
